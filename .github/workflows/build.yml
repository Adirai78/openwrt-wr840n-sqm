name: Build OpenWrt WR840N v6.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk \
        gcc-multilib gettext git libncurses-dev libssl-dev python3-distutils \
        rsync unzip zlib1g-dev file wget python3 python3-pip

    - name: Clone OpenWrt
      run: |
        git clone https://github.com/openwrt/openwrt.git
        cd openwrt
        git checkout v19.07.10

    - name: Prepare feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Copy custom.config
      run: |
        cd openwrt
        cp ../custom.config .config
        yes "" | make defconfig

    - name: Copy files (IP LAN 192.168.33.1)
      run: |
        cd openwrt
        mkdir -p files
        cp -r ../files/* files/

    - name: Build firmware
      run: |
        cd openwrt
        make -j$(nproc) download
        make -j$(nproc) V=s

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: firmware-wr840n-v6.2
        path: openwrt/bin/targets/ramips/mt76x8/*sysupgrade.bin
