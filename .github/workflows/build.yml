name: Build OpenWrt WR840N v6.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib \
        gettext git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev file wget \
        python3-pip

    - name: Clone OpenWrt source
      run: git clone https://git.openwrt.org/openwrt/openwrt.git

    - name: Update & install feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Apply custom config
      working-directory: ./openwrt
      run: |
        cp $GITHUB_WORKSPACE/custom.config .config
        yes "" | make defconfig

    - name: Download toolchain
      working-directory: ./openwrt
      run: make download -j8

    - name: Compile firmware
      working-directory: ./openwrt
      run: make -j$(nproc)

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-wr840n-v6.2-firmware
        path: openwrt/bin/targets/*/*
